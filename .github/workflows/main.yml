name: "Main"
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    permissions:
      contents: read
    strategy:
      # fail-fast: true
      matrix:
        include:
          # - runner: macos-15
          #   platform: darwin-arm64
          #   cgo: "1"
          # - runner: macos-15-intel
          #   platform: darwin-amd64
          #   cgo: "1"
          # - runner: ubuntu-24.04
          #   platform: linux-amd64
          #   cgo: "1"
          # - runner: ubuntu-24.04
          #   platform: linux-amd64-musl
          #   cgo: "0"
          # - runner: ubuntu-24.04-arm
          #   platform: linux-arm64
          #   cgo: "1"
          # - runner: ubuntu-24.04-arm
          #   platform: linux-arm64-musl
          #   cgo: "0"
          - runner: windows-2025
            platform: windows-amd64
            cgo: "1"
          # - runner: windows-2025
          #   platform: windows-arm64
          #   cgo: "0"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Clone sqlc source
        run: just clone
        shell: bash
      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: just build ${{ matrix.platform }}
        shell: bash
      - name: Smoke test
        if: matrix.platform != 'windows-arm64'
        run: just smoke-test
        shell: bash
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Publish
        run: uv publish dist/*.whl
