name: "Main"

on:
  push:

jobs:
  publish:
    if: startsWith(github.event.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build
        run: just build
      - name: Publish
        run: uv publish
