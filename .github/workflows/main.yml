name: "Main"

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: read
    strategy:
      # fail-fast: true
      matrix:
        include:
          # - runner: macos-15
          #   platform: darwin-arm64
          #   cgo: "1"
          # - runner: macos-15-intel
          #   platform: darwin-amd64
          #   cgo: "1"
          # - runner: ubuntu-24.04
          #   platform: linux-amd64
          #   cgo: "1"
          # - runner: ubuntu-24.04
          #   platform: linux-amd64-musl
          #   cgo: "1"
          # - runner: ubuntu-24.04-arm
          #   platform: linux-arm64
          #   cgo: "1"
          # - runner: ubuntu-24.04-arm
          #   platform: linux-arm64-musl
          #   cgo: "1"
          # - runner: windows-2025
          #   platform: windows-amd64
          #   cgo: "1"
          - runner: windows-11-arm
            platform: windows-arm64
            cgo: "1"
            cc: aarch64-w64-mingw32-gcc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install just
        uses: taiki-e/install-action@just
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set sqlc_src path
        id: paths
        run: |
          RAW="${{ runner.temp }}/sqlc-build"
          echo "sqlc_src=$(cygpath -u "$RAW" 2>/dev/null || echo "$RAW")" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install llvm-mingw (ARM64 CGO toolchain)
        if: matrix.platform == 'windows-arm64'
        run: |
          curl -L -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20251216/llvm-mingw-20251216-ucrt-x86_64.zip
          unzip -q llvm-mingw.zip -d /c/llvm-mingw
          echo "/c/llvm-mingw/llvm-mingw-20251216-ucrt-x86_64/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Clone sqlc source
        run: just sqlc_src="${{ steps.paths.outputs.sqlc_src }}" clone
        shell: bash

      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          CC: ${{ matrix.cc || '' }}
        run: |
          rm -rf dist
          VERSION=$(uv version | awk '{print $2}')
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$ ]]; then
            echo "::error::Unexpected version format: '$VERSION'"
            exit 1
          fi
          uv run python build_wheel.py "${{ steps.paths.outputs.sqlc_src }}" \
            --name sqlc --version "$VERSION" \
            --entry-point sqlc --platform "${{ matrix.platform }}"
        shell: bash

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Publish
        run: uv publish dist/*.whl
